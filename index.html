<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БУНКЕР LIVE v2.1</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: #141b29;
    --card-border: #232f46;
    --accent: #f59e0b;
    --blue: #3b82f6;
    --green: #10b981;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
  .container { max-width: 920px; margin: 0 auto; padding: 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 16px; border-radius: 14px; border: 1px solid var(--card-border); margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .logo { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .badge-v { background: var(--green); color: #000; font-size: 0.72rem; padding: 2px 7px; border-radius: 6px; font-weight: 900; }
  .status-pill { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 600; }
  .status-pill.err { background: rgba(239, 68, 68, 0.15); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }

  .btn { cursor: pointer; border: none; border-radius: 10px; padding: 11px 16px; font-weight: 700; font-size: 0.95rem; transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: #fff; background: #263248; }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-blue { background: var(--blue); }
  .btn-green { background: var(--green); color: #000; }
  .btn-red { background: var(--red); }
  .btn-sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 8px; }
  .btn-block { width: 100%; }

  .screen { display: none; }
  .screen.active { display: block; }
  .hero-box { background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 24px; text-align: center; max-width: 460px; margin: 20px auto; }
  .hero-box h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .hero-box p { color: var(--muted); font-size: 0.92rem; margin-bottom: 18px; }
  .role-grid { display: flex; flex-direction: column; gap: 10px; }
  .input-field { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--card-border); background: #0b0f17; color: #fff; font-size: 1rem; margin-bottom: 12px; }
  textarea.input-field { min-height: 110px; resize: vertical; }

  .card-box { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .my-card { border: 2px solid var(--blue); background: #131c2e; }
  .trait-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px dashed rgba(255,255,255,0.08); gap: 8px; font-size: 0.9rem; }
  .trait-row:last-child { border-bottom: none; }
  .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .p-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; }
  .p-card.eliminated { opacity: 0.45; border-color: var(--red); }
  .timer-box { font-size: 1.4rem; font-weight: 900; background: #0b0f17; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--card-border); color: var(--green); }
  .admin-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; font-weight: 800; padding: 10px 18px; border-radius: 12px; z-index: 200; display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <div class="logo">☢️ БУНКЕР <span class="badge-v">LIVE v2.1 (Fast Sync)</span></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span id="connStatus" class="status-pill">● Подключение...</span>
      <button id="logoutBtn" class="btn btn-sm btn-red" style="display:none;" onclick="logoutRole()">Выйти</button>
    </div>
  </div>

  <!-- 1. ВХОД -->
  <div id="screenLogin" class="screen active">
    <div class="hero-box">
      <h1>Бункер Онлайн</h1>
      <p>Выберите вашу роль для входа в игру</p>
      <div class="role-grid">
        <button class="btn btn-green btn-block" onclick="selectPlayerMode()">👥 Я обычный игрок</button>
        <button class="btn btn-primary btn-block" onclick="openAdminAuth(1)">🛡️ Ведущий №1 (Админ)</button>
        <button class="btn btn-blue btn-block" onclick="openAdminAuth(2)">🛡️ Ведущий №2 (Админ)</button>
      </div>
      <div id="adminPassBox" style="display:none; margin-top:16px; padding-top:14px; border-top:1px solid var(--card-border);">
        <p id="adminPassTitle" style="margin-bottom:8px; font-weight:700; color:var(--accent);"></p>
        <input type="password" id="adminPassInput" class="input-field" placeholder="Пароль ведущего">
        <button class="btn btn-primary btn-block" onclick="submitAdminAuth()">Войти</button>
      </div>
    </div>
  </div>

  <!-- 2. ВЫБОР ИМЕНИ -->
  <div id="screenPickPlayer" class="screen">
    <div class="hero-box">
      <h2>Выберите своё имя</h2>
      <div id="playerPickList" class="role-grid"></div>
      <p id="noGameMsg" style="display:none; color:var(--accent); margin-top:12px;">Ожидание запуска игры ведущими...</p>
    </div>
  </div>

  <!-- 3. ИГРА -->
  <div id="screenGame" class="screen">
    <div id="adminSetupBox" class="card-box" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="color:var(--accent);">⚙️ Настройка партии</h3>
        <button class="btn btn-sm" onclick="changePasswordsPrompt()">🔑 Сменить пароли</button>
      </div>
      <div id="newGameForm">
        <div class="admin-row">
          <button class="btn btn-sm" onclick="fillPreset(15)">15 игроков</button>
          <button class="btn btn-sm" onclick="fillPreset(18)">18 игроков</button>
          <button class="btn btn-sm" onclick="fillPreset(22)">22 игрока</button>
        </div>
        <textarea id="namesInput" class="input-field" placeholder="Имена игроков (каждое с новой строки)"></textarea>
        <div class="admin-row">
          <label>Мест в бункере: <input type="number" id="seatsInput" value="8" min="2" max="20" style="width:60px; padding:6px; border-radius:8px; background:#0b0f17; color:#fff; border:1px solid var(--card-border);"></label>
          <button class="btn btn-green" style="flex:1;" onclick="createNewGame()">🚀 Создать игру</button>
        </div>
      </div>
    </div>

    <div id="adminLiveControls" class="card-box" style="display:none;">
      <div class="admin-row" style="justify-content:space-between;">
        <strong style="color:var(--accent);">🎛️ Пульт ведущего</strong>
        <div id="timerDisplay" class="timer-box">00:00</div>
      </div>
      <div class="admin-row">
        <button class="btn btn-sm" onclick="startTimer(20)">⏱️ 20 сек</button>
        <button class="btn btn-sm" onclick="startTimer(30)">⏱️ 30 сек</button>
        <button class="btn btn-sm" onclick="startTimer(180)">⏱️ 3 мин</button>
        <button class="btn btn-sm btn-red" onclick="stopTimer()">⏹️ Стоп</button>
        <button class="btn btn-sm btn-red" style="margin-left:auto;" onclick="resetGameConfirm()">Новая игра</button>
      </div>
    </div>

    <div id="disasterBlock" class="card-box" style="display:none;">
      <h3 id="disasterTitle" style="color:var(--accent); margin-bottom:6px;"></h3>
      <p id="disasterDesc" style="font-size:0.92rem; color:#cbd5e1; margin-bottom:8px;"></p>
      <p id="bunkerMeta" style="font-size:0.85rem; font-weight:700; color:var(--green);"></p>
    </div>

    <div id="mySecretCard" class="card-box my-card" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 id="myPlayerName" style="color:var(--blue);"></h3>
        <button class="btn btn-sm" onclick="changeMyPlayer()">Сменить имя</button>
      </div>
      <div id="myTraitsList"></div>
    </div>

    <div id="playersContainer" class="players-grid"></div>
  </div>
</div>

<div id="toastBox" class="toast"></div>

<script>
const DB_URL = "https://firebasedatabase.app";

const DISASTERS = [
  { title: "☄️ Падение астероида", desc: "Пыль закрыла Солнце, температура -45°C, кислотные дожди.", bunker: "Срок: 2 года | Сбоит очистка воздуха, есть медотсек без врача." },
  { title: "☣️ Пандемия вируса «Некро-9»", desc: "Поверхность охвачена эпидемией, города закрыты на карантин.", bunker: "Срок: 1.5 года | Гермошлюз требует ручной настройки." },
  { title: "☢️ Ядерная зима", desc: "Высокий радиационный фон, электроника на поверхности выведена из строя.", bunker: "Срок: 3 года | Есть гидропонная ферма, дизель-генератор на пределе." }
];

const PROFS = ["Врач-хирург", "Инженер-электрик", "Агроном", "Повар-технолог", "Слесарь-сантехник", "Психолог", "Строитель", "Биохимик", "Охотник", "Спасатель МЧС", "Ветеринар", "Сварщик", "Учитель", "Программист", "Автомеханик", "Стендап-комик", "Переводчик", "Юрист", "Блогер", "Фитнес-тренер"];
const HEALTHS = ["Идеально здоров", "Лёгкая астма", "Близорукость -4.5", "Аллергия на пыль", "Гастрит", "Гипертония", "Плоскостопие", "Диабет 2-го типа", "Бессонница", "Носитель универсальной крови 0-"];
const HOBBIES = ["Радиолюбитель", "Игра на гитаре", "Самогоноварение", "Бокс (КМС)", "Шитьё и ремонт", "Настольные игры", "Травничество", "Стрельба из лука", "Пчеловодство", "Кулинарная выпечка"];
const PHOBIAS = ["Клаустрофобия", "Арахнофобия", "Гемофобия (боязнь крови)", "Лидерские замашки", "Перфекционист", "Подозрительность", "Вспыльчивость", "Интроверт", "Клептомания", "Гипер-оптимист"];
const BAGS = ["Полевая аптечка", "Набор инструментов", "Семена овощей", "Ящик тушёнки", "Канистра спирта 20л", "Солнечная панель и фонари", "Фильтр для воды", "Настольные игры и книги", "Охотничье ружьё", "Сварочный аппарат"];

const TRAIT_NAMES = { prof: "Профессия", bio: "Биология", health: "Здоровье", hobby: "Хобби", phobia: "Характер/Фобия", bag: "Багаж" };

let currentRole = localStorage.getItem("bunker_role") || null;
let myPlayerId = localStorage.getItem("bunker_pid") || null;
let selectedAdminSlot = 1;
let gameState = null;
let adminPasswords = { p1: "1111", p2: "2222" };
let sseSource = null;
let isPushing = false;
let localVersion = 0;

function el(id) { return document.getElementById(id); }
function toast(msg) {
  const t = el("toastBox");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => { t.style.display = "none"; }, 2600);
}

// --- ПОТОКОВАЯ СИНХРОНИЗАЦИЯ (SSE) БЕЗ ЗАДЕРЖЕК ---
function initFastSync() {
  if (sseSource) sseSource.close();
  try {
    sseSource = new EventSource(DB_URL + "/gameRoom.json");
    sseSource.onopen = () => setOnlineStatus(true);
    sseSource.addEventListener("put", (e) => {
      if (isPushing) return;
      const msg = JSON.parse(e.data);
      if (msg.path === "/") {
        applyRemoteData(msg.data);
      } else {
        fetchFullState();
      }
      setOnlineStatus(true);
    });
    sseSource.addEventListener("patch", () => {
      if (!isPushing) fetchFullState();
    });
    sseSource.onerror = () => {
      setOnlineStatus(false);
    };
  } catch (err) {
    setOnlineStatus(false);
    setInterval(() => { if (!isPushing) fetchFullState(); }, 1000);
  }
  fetchFullState();
}

function setOnlineStatus(ok) {
  const pill = el("connStatus");
  if (ok) {
    pill.textContent = "● Мгновенная связь (SSE)";
    pill.classList.remove("err");
  } else {
    pill.textContent = "● Переподключение...";
    pill.classList.add("err");
  }
}

async function fetchFullState() {
  if (isPushing) return;
  try {
    const res = await fetch(DB_URL + "/gameRoom.json", { cache: "no-store" });
    const data = await res.json();
    applyRemoteData(data);
    setOnlineStatus(true);
  } catch (e) {
    setOnlineStatus(false);
  }
}

function applyRemoteData(data) {
  if (data && data.passwords) adminPasswords = data.passwords;
  const remoteState = (data && data.state) ? data.state : null;
  if (remoteState && remoteState._ver && remoteState._ver < localVersion) return;
  if (remoteState && remoteState._ver) localVersion = remoteState._ver;
  gameState = remoteState;
  renderAll();
}

async function pushState(newState) {
  isPushing = true;
  if (newState) {
    localVersion = Date.now();
    newState._ver = localVersion;
  } else {
    localVersion = 0;
  }
  gameState = newState;
  renderAll(); // Мгновенно отрисовываем у нажавшего
  try {
    await fetch(DB_URL + "/gameRoom/state.json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(newState)
    });
  } finally {
    setTimeout(() => { isPushing = false; }, 300);
  }
}

// --- АВТОРИЗАЦИЯ ---
function openAdminAuth(slot) {
  selectedAdminSlot = slot;
  el("adminPassTitle").textContent = "Пароль для Ведущего №" + slot;
  el("adminPassBox").style.display = "block";
  el("adminPassInput").value = "";
  el("adminPassInput").focus();
}

function submitAdminAuth() {
  const val = el("adminPassInput").value.trim();
  const expected = selectedAdminSlot === 1 ? adminPasswords.p1 : adminPasswords.p2;
  if (val === expected) {
    currentRole = selectedAdminSlot === 1 ? "admin1" : "admin2";
    localStorage.setItem("bunker_role", currentRole);
    renderAll();
  } else {
    toast("❌ Неверный пароль");
  }
}

async function changePasswordsPrompt() {
  const p1 = prompt("Новый пароль для Ведущего №1:", adminPasswords.p1);
  if (!p1) return;
  const p2 = prompt("Новый пароль для Ведущего №2:", adminPasswords.p2);
  if (!p2) return;
  adminPasswords = { p1: p1.trim(), p2: p2.trim() };
  await fetch(DB_URL + "/gameRoom/passwords.json", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(adminPasswords)
  });
  toast("✅ Пароли сохранены!");
}

function selectPlayerMode() {
  currentRole = "player";
  localStorage.setItem("bunker_role", "player");
  renderAll();
}

function pickPlayerIdentity(pid) {
  myPlayerId = pid;
  localStorage.setItem("bunker_pid", pid);
  renderAll();
}

function changeMyPlayer() {
  myPlayerId = null;
  localStorage.removeItem("bunker_pid");
  renderAll();
}

function logoutRole() {
  currentRole = null;
  myPlayerId = null;
  localStorage.removeItem("bunker_role");
  localStorage.removeItem("bunker_pid");
  el("adminPassBox").style.display = "none";
  renderAll();
}

// --- ЛОГИКА ИГРЫ ---
function fillPreset(n) {
  const arr = [];
  for (let i = 1; i <= n; i++) arr.push("Игрок " + i);
  el("namesInput").value = arr.join("\n");
  el("seatsInput").value = Math.floor(n / 2);
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

async function createNewGame() {
  const names = el("namesInput").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (names.length < 4) return toast("Нужно минимум 4 игрока!");
  const seats = parseInt(el("seatsInput").value) || Math.floor(names.length / 2);
  const disaster = pick(DISASTERS);
  const players = names.map((name, i) => ({
    id: "p_" + i + "_" + Math.floor(Math.random() * 1000),
    name,
    alive: true,
    traits: {
      prof: pick(PROFS),
      bio: (Math.random() > 0.5 ? "Мужчина, " : "Женщина, ") + (Math.floor(Math.random() * 40) + 18) + " лет",
      health: pick(HEALTHS),
      hobby: pick(HOBBIES),
      phobia: pick(PHOBIAS),
      bag: pick(BAGS)
    },
    revealed: { prof: false, bio: false, health: false, hobby: false, phobia: false, bag: false }
  }));
  await pushState({ disaster, seats, timerEnd: null, players });
  toast("🚀 Игра запущена!");
}

function resetGameConfirm() {
  if (confirm("Завершить текущую игру?")) pushState(null);
}

function isAdmin() { return currentRole === "admin1" || currentRole === "admin2"; }

function startTimer(sec) {
  if (!gameState || !isAdmin()) return;
  gameState.timerEnd = Date.now() + sec * 1000;
  pushState(gameState);
}

function stopTimer() {
  if (!gameState || !isAdmin()) return;
  gameState.timerEnd = null;
  pushState(gameState);
}

function toggleTrait(pid, key) {
  if (!gameState || !isAdmin()) return;
  const p = gameState.players.find(x => x.id === pid);
  if (p) {
    p.revealed[key] = !p.revealed[key];
    pushState(gameState);
  }
}

function toggleEliminate(pid) {
  if (!gameState || !isAdmin()) return;
  const p = gameState.players.find(x => x.id === pid);
  if (p) {
    p.alive = !p.alive;
    if (!p.alive) Object.keys(p.revealed).forEach(k => p.revealed[k] = true);
    pushState(gameState);
  }
}

// --- ОТРИСОВКА ---
function renderAll() {
  el("screenLogin").classList.toggle("active", !currentRole);
  el("logoutBtn").style.display = currentRole ? "inline-flex" : "none";

  const isPicking = currentRole === "player" && !myPlayerId;
  el("screenPickPlayer").classList.toggle("active", isPicking);

  const inGame = Boolean(currentRole && !isPicking);
  el("screenGame").classList.toggle("active", inGame);

  if (isPicking) {
    const list = el("playerPickList");
    list.innerHTML = "";
    if (!gameState || !gameState.players) {
      el("noGameMsg").style.display = "block";
    } else {
      el("noGameMsg").style.display = "none";
      gameState.players.forEach(p => {
        const b = document.createElement("button");
        b.className = "btn btn-block";
        b.textContent = p.name;
        b.onclick = () => pickPlayerIdentity(p.id);
        list.appendChild(b);
      });
    }
    return;
  }

  if (!inGame) return;

  el("adminSetupBox").style.display = isAdmin() ? "block" : "none";
  el("newGameForm").style.display = (isAdmin() && !gameState) ? "block" : "none";
  el("adminLiveControls").style.display = (isAdmin() && gameState) ? "block" : "none";

  if (!gameState) {
    el("disasterBlock").style.display = "none";
    el("mySecretCard").style.display = "none";
    el("playersContainer").innerHTML = '<p style="color:var(--muted); text-align:center; grid-column:1/-1; padding:24px;">Ожидание запуска игры ведущими...</p>';
    return;
  }

  el("disasterBlock").style.display = "block";
  el("disasterTitle").textContent = gameState.disaster.title;
  el("disasterDesc").textContent = gameState.disaster.desc;
  const aliveCount = gameState.players.filter(p => p.alive).length;
  el("bunkerMeta").textContent = "Мест в бункере: " + gameState.seats + " | Живых: " + aliveCount + " из " + gameState.players.length + " | " + gameState.disaster.bunker;

  if (currentRole === "player" && myPlayerId) {
    const me = gameState.players.find(p => p.id === myPlayerId);
    if (me) {
      el("mySecretCard").style.display = "block";
      el("myPlayerName").textContent = "Ваша карта: " + me.name;
      el("myTraitsList").innerHTML = Object.keys(TRAIT_NAMES).map(k =>
        '<div class="trait-row"><span style="color:var(--muted);">' + TRAIT_NAMES[k] + ':</span><strong>' + me.traits[k] + '</strong></div>'
      ).join("");
    }
  } else {
    el("mySecretCard").style.display = "none";
  }

  const sorted = [...gameState.players].sort((a, b) => (a.alive === b.alive ? 0 : a.alive ? -1 : 1));
  el("playersContainer").innerHTML = sorted.map(p => {
    const traitsHtml = Object.keys(TRAIT_NAMES).map(k => {
      const open = p.revealed[k];
      const text = (open || isAdmin()) ? p.traits[k] : '<span style="color:#475569;">Скрыто 🔒</span>';
      const btn = isAdmin() ? '<button class="btn btn-sm" style="padding:2px 7px; background:' + (open ? '#10b981' : '#334155') + '; color:' + (open ? '#000' : '#fff') + ';" onclick="toggleTrait(\'' + p.id + '\',\'' + k + '\')">' + (open ? '👁️' : '🔒') + '</button>' : '';
      return '<div class="trait-row"><div><span style="color:var(--muted); font-size:0.78rem;">' + TRAIT_NAMES[k] + ':</span> ' + text + '</div>' + btn + '</div>';
    }).join("");

    const elimBtn = isAdmin() ? '<button class="btn btn-sm ' + (p.alive ? 'btn-red' : 'btn-green') + '" style="margin-top:10px; width:100%;" onclick="toggleEliminate(\'' + p.id + '\')">' + (p.alive ? '🚫 Выгнать' : '♻️ Вернуть') + '</button>' : '';

    return '<div class="p-card ' + (p.alive ? '' : 'eliminated') + '">' +
      '<div style="display:flex; justify-content:space-between; font-weight:800; margin-bottom:8px;"><span>' + p.name + '</span><span style="color:' + (p.alive ? 'var(--green)' : 'var(--red)') + '; font-size:0.8rem;">' + (p.alive ? '● В игре' : '✖ Выбыл') + '</span></div>' +
      traitsHtml + elimBtn + '</div>';
  }).join("");
}

setInterval(() => {
  const disp = el("timerDisplay");
  if (!disp) return;
  if (!gameState || !gameState.timerEnd) { disp.textContent = "00:00"; return; }
  const diff = Math.max(0, Math.ceil((gameState.timerEnd - Date.now()) / 1000));
  disp.textContent = String(Math.floor(diff / 60)).padStart(2, "0") + ":" + String(diff % 60).padStart(2, "0");
}, 250);

initFastSync();
</script>
</body>
</html>
